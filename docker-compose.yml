services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stayprice
      POSTGRES_PASSWORD: stayprice
      POSTGRES_DB: stayprice
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayprice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://stayprice:stayprice@postgres:5432/stayprice
      DATABASE_URL_SYNC: postgresql://stayprice:stayprice@postgres:5432/stayprice
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/stayprice
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: >
      sh -c "alembic upgrade head &&
             PYTHONPATH=/app python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://stayprice:stayprice@postgres:5432/stayprice
      DATABASE_URL_SYNC: postgresql://stayprice:stayprice@postgres:5432/stayprice
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      APP_ENV: development
    depends_on:
      - api
      - redis
    volumes:
      - ./apps/api:/app
    command: celery -A app.workers.tasks.celery_app worker -l info

  beat:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://stayprice:stayprice@postgres:5432/stayprice
      DATABASE_URL_SYNC: postgresql://stayprice:stayprice@postgres:5432/stayprice
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - worker
    volumes:
      - ./apps/api:/app
    command: celery -A app.workers.tasks.celery_app beat -l info

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  miniodata:
